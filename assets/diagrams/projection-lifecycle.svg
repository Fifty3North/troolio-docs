<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc"><title id="title">Commit the view and its receipt together</title><desc id="desc">A verified committed source is mapped to a read model. SQL writes the materialized view and projection inbox together. A refresh hint is published after commit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#819fbd" stroke-width="1.6"/></marker></defs><style>.label{font:700 17px system-ui,sans-serif}.detail{font:14px system-ui,sans-serif;fill:#b9c8db}.heading{font:700 21px system-ui,sans-serif;fill:#f3f7ff}</style><rect width="1100" height="390" rx="17" fill="#0e1624" stroke="#2b3547"/><text x="28" y="38" class="heading">Commit the view and its receipt together</text><rect x="28" y="80" width="205" height="98" rx="12" fill="#142033" stroke="#8ca8ff" stroke-opacity=".65"/><text x="43" y="109" class="label" fill="#8ca8ff">Source identity</text><text x="43" y="135" class="detail">Consumer + stream</text><text x="43" y="156" class="detail">Version / domain facts</text><rect x="293" y="80" width="205" height="98" rx="12" fill="#142033" stroke="#63e6e2" stroke-opacity=".65"/><text x="308" y="109" class="label" fill="#63e6e2">Validate + map</text><text x="308" y="135" class="detail">Expected actor and type</text><text x="308" y="156" class="detail">Pure view calculation</text><rect x="558" y="80" width="225" height="98" rx="12" fill="#142033" stroke="#f5c66d" stroke-opacity=".65"/><text x="573" y="109" class="label" fill="#f5c66d">SQL transaction</text><text x="573" y="135" class="detail">Update semantic view</text><text x="573" y="156" class="detail">Retain source inbox</text><rect x="843" y="80" width="229" height="98" rx="12" fill="#142033" stroke="#f39fc2" stroke-opacity=".65"/><text x="858" y="109" class="label" fill="#f39fc2">Commit result</text><text x="858" y="135" class="detail">Applied or duplicate</text><text x="858" y="156" class="detail">Known durable outcome</text><path d="M233 129 L293 129" stroke="#819fbd" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M498 129 L558 129" stroke="#819fbd" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M783 129 L843 129" stroke="#819fbd" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="558" y="250" width="225" height="98" rx="12" fill="#142033" stroke="#63e6e2" stroke-opacity=".65"/><text x="573" y="279" class="label" fill="#63e6e2">Reader</text><text x="573" y="305" class="detail">Indexed, scoped query</text><text x="573" y="326" class="detail">Projection can lag</text><rect x="843" y="250" width="229" height="98" rx="12" fill="#142033" stroke="#8ca8ff" stroke-opacity=".65"/><text x="858" y="279" class="label" fill="#8ca8ff">Refresh hint</text><text x="858" y="305" class="detail">After SQL commit</text><text x="858" y="326" class="detail">Client re-reads safely</text><path d="M957 178 L957 250" stroke="#819fbd" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="28" y="280" class="detail">A retry reuses the same source identity.</text><text x="28" y="309" class="detail">Changed source content is a conflict.</text><text x="28" y="338" class="detail">Delta projections also need ordering.</text></svg>