<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">State restoration and live delivery have different jobs</title><desc id="desc">Historical replay applies pure event handlers to restore actor state. Committed live source feeds durable consumers and external work separately.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#819fbd" stroke-width="1.6"/></marker></defs><style>.label{font:700 17px system-ui,sans-serif}.detail{font:14px system-ui,sans-serif;fill:#b9c8db}.heading{font:700 21px system-ui,sans-serif;fill:#f3f7ff}</style><rect width="1100" height="360" rx="17" fill="#0e1624" stroke="#2b3547"/><text x="28" y="38" class="heading">State restoration and live delivery have different jobs</text><rect x="28" y="80" width="225" height="84" rx="12" fill="#142033" stroke="#f5c66d" stroke-opacity=".65"/><text x="43" y="109" class="label" fill="#f5c66d">Historical events</text><text x="43" y="135" class="detail">One actor history</text><rect x="303" y="80" width="225" height="84" rx="12" fill="#142033" stroke="#63e6e2" stroke-opacity=".65"/><text x="318" y="109" class="label" fill="#63e6e2">Pure On(event)</text><text x="318" y="135" class="detail">No commands or I/O</text><rect x="578" y="80" width="225" height="84" rx="12" fill="#142033" stroke="#8ca8ff" stroke-opacity=".65"/><text x="593" y="109" class="label" fill="#8ca8ff">Actor state</text><text x="593" y="135" class="detail">Reconstructed result</text><path d="M253 122 L303 122" stroke="#819fbd" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M528 122 L578 122" stroke="#819fbd" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M28 194 L1072 194" stroke="#2b3547" stroke-dasharray="5 5"/><rect x="28" y="230" width="225" height="84" rx="12" fill="#142033" stroke="#f39fc2" stroke-opacity=".65"/><text x="43" y="259" class="label" fill="#f39fc2">Committed live source</text><text x="43" y="285" class="detail">Retained handoff</text><rect x="303" y="230" width="225" height="84" rx="12" fill="#142033" stroke="#8ca8ff" stroke-opacity=".65"/><text x="318" y="259" class="label" fill="#8ca8ff">Consumer delivery</text><text x="318" y="285" class="detail">Validate and deduplicate</text><rect x="578" y="230" width="225" height="84" rx="12" fill="#142033" stroke="#f5c66d" stroke-opacity=".65"/><text x="593" y="259" class="label" fill="#f5c66d">SQL read model</text><text x="593" y="285" class="detail">Current query shape</text><rect x="853" y="230" width="219" height="84" rx="12" fill="#142033" stroke="#63e6e2" stroke-opacity=".65"/><text x="868" y="259" class="label" fill="#63e6e2">Effect intent</text><text x="868" y="285" class="detail">Separate durable work</text><path d="M253 272 L303 272" stroke="#819fbd" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M528 272 L578 272" stroke="#819fbd" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="855" y="119" class="detail">Replay has no live</text><text x="855" y="145" class="detail">subscriber side effects.</text></svg>