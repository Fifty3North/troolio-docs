<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" role="img" aria-labelledby="title desc"><title id="title">Correlation groups the story; causation connects the steps</title><desc id="desc">All messages share correlation R. Command A causes event B, which causes internal command C and another branch. Command C causes event D.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#819fbd" stroke-width="1.6"/></marker></defs><style>.label{font:700 17px system-ui,sans-serif}.detail{font:14px system-ui,sans-serif;fill:#b9c8db}.heading{font:700 21px system-ui,sans-serif;fill:#f3f7ff}</style><rect width="1080" height="400" rx="17" fill="#0e1624" stroke="#2b3547"/><text x="28" y="38" class="heading">Correlation groups the story; causation connects the steps</text><rect x="28" y="60" width="1024" height="34" rx="8" fill="#182d38"/><text x="45" y="83" class="detail">Correlation R is preserved across the related work</text><rect x="28" y="124" width="220" height="98" rx="12" fill="#142033" stroke="#8ca8ff" stroke-opacity=".65"/><text x="43" y="153" class="label" fill="#8ca8ff">Command A</text><text x="43" y="179" class="detail">Parent: root context</text><text x="43" y="200" class="detail">Request registration</text><rect x="298" y="124" width="220" height="98" rx="12" fill="#142033" stroke="#f39fc2" stroke-opacity=".65"/><text x="313" y="153" class="label" fill="#f39fc2">Event B</text><text x="313" y="179" class="detail">Causation: A</text><text x="313" y="200" class="detail">Registration requested</text><rect x="568" y="124" width="220" height="98" rx="12" fill="#142033" stroke="#63e6e2" stroke-opacity=".65"/><text x="583" y="153" class="label" fill="#63e6e2">Command C</text><text x="583" y="179" class="detail">Causation: B</text><text x="583" y="200" class="detail">Add to workshop roster</text><rect x="838" y="124" width="220" height="98" rx="12" fill="#142033" stroke="#f5c66d" stroke-opacity=".65"/><text x="853" y="153" class="label" fill="#f5c66d">Event D</text><text x="853" y="179" class="detail">Causation: C</text><text x="853" y="200" class="detail">Attendee added</text><path d="M248 173 L298 173" stroke="#819fbd" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M518 173 L568 173" stroke="#819fbd" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M788 173 L838 173" stroke="#819fbd" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="298" y="280" width="220" height="98" rx="12" fill="#142033" stroke="#8ca8ff" stroke-opacity=".65"/><text x="313" y="309" class="label" fill="#8ca8ff">Another branch</text><text x="313" y="335" class="detail">Triggered by B</text><text x="313" y="356" class="detail">Projection or effect work</text><path d="M408 222 L408 280" stroke="#819fbd" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="570" y="315" class="detail">A new message has its own identity.</text><text x="570" y="343" class="detail">The parent is the immediate cause.</text></svg>