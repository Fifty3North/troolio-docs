<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 415" role="img" aria-labelledby="title desc"><title id="title">Selected atomic command route</title><desc id="desc">A selected command is authenticated, bound to a stable identity and current route, planned as a closed batch, then committed with a receipt. External effects are separate.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7794b3" stroke-width="1.8"/></marker></defs><style>.label{font:700 17px system-ui,sans-serif}.detail{font:13px system-ui,sans-serif;fill:#b4c4d9}.caption{font:14px system-ui,sans-serif;fill:#a8b5c8}.heading{font:700 20px system-ui,sans-serif;fill:#f3f7ff}</style><rect width="1050" height="415" rx="17" fill="#0e1624" stroke="#2b3547"/><text x="30" y="37" class="heading">Selected atomic command route</text><rect x="30" y="75" width="170" height="82" rx="13" fill="#141e2e" stroke="#8ca8ff" stroke-opacity=".75"/><text x="48" y="106" class="label" fill="#8ca8ff">Ingress</text><text x="48" y="131" class="detail">Authenticate request</text><rect x="235" y="75" width="170" height="82" rx="13" fill="#141e2e" stroke="#63e6e2" stroke-opacity=".75"/><text x="253" y="106" class="label" fill="#63e6e2">Identity</text><text x="253" y="131" class="detail">Bind exact bytes</text><rect x="440" y="75" width="170" height="82" rx="13" fill="#141e2e" stroke="#8ca8ff" stroke-opacity=".75"/><text x="458" y="106" class="label" fill="#8ca8ff">Route lease</text><text x="458" y="131" class="detail">Current epoch</text><rect x="645" y="75" width="170" height="82" rx="13" fill="#141e2e" stroke="#f39fc2" stroke-opacity=".75"/><text x="663" y="106" class="label" fill="#f39fc2">Closed plan</text><text x="663" y="131" class="detail">All participants</text><rect x="850" y="75" width="170" height="82" rx="13" fill="#141e2e" stroke="#f5c66d" stroke-opacity=".75"/><text x="868" y="106" class="label" fill="#f5c66d">Atomic store</text><text x="868" y="131" class="detail">One receipt</text><path d="M200 116 L235 116" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M405 116 L440 116" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M610 116 L645 116" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M815 116 L850 116" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="30" y="208" class="caption">The store checks the route fence and expected versions at commit time.</text><rect x="235" y="242" width="580" height="104" rx="13" fill="#101b2a" stroke="#63e6e2" stroke-opacity=".6"/><text x="260" y="274" class="label" fill="#63e6e2">Commit together</text><text x="260" y="301" class="detail">Participant events  ·  required ancillary writes</text><text x="260" y="325" class="detail">Projection handoffs  ·  completion receipt</text><path d="M935 157 L935 294" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M935 294 L815 294" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="30" y="385" class="caption">External effects run through durable intents and idempotent providers after commit.</text></svg>