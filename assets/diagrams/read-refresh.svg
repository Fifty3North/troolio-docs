<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 330" role="img" aria-labelledby="title desc"><title id="title">A hint prompts an authorized read</title><desc id="desc">Projection commit precedes a small hint. The UI refreshes through the current authorized reader rather than treating the hint as data or authority.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#819fbd" stroke-width="1.6"/></marker></defs><style>.label{font:700 17px system-ui,sans-serif}.detail{font:14px system-ui,sans-serif;fill:#b9c8db}.heading{font:700 21px system-ui,sans-serif;fill:#f3f7ff}</style><rect width="1080" height="330" rx="17" fill="#0e1624" stroke="#2b3547"/><text x="28" y="38" class="heading">A hint prompts an authorized read</text><rect x="28" y="90" width="220" height="98" rx="12" fill="#142033" stroke="#f5c66d" stroke-opacity=".65"/><text x="43" y="119" class="label" fill="#f5c66d">SQL view commits</text><text x="43" y="145" class="detail">Durable data is current</text><text x="43" y="166" class="detail">At its source position</text><rect x="298" y="90" width="220" height="98" rx="12" fill="#142033" stroke="#8ca8ff" stroke-opacity=".65"/><text x="313" y="119" class="label" fill="#8ca8ff">Small hint</text><text x="313" y="145" class="detail">Registration reference</text><text x="313" y="166" class="detail">No access grant</text><rect x="568" y="90" width="220" height="98" rx="12" fill="#142033" stroke="#f39fc2" stroke-opacity=".65"/><text x="583" y="119" class="label" fill="#f39fc2">UI refresh</text><text x="583" y="145" class="detail">Coalesce bursts</text><text x="583" y="166" class="detail">Handle reconnects</text><rect x="838" y="90" width="220" height="98" rx="12" fill="#142033" stroke="#63e6e2" stroke-opacity=".65"/><text x="853" y="119" class="label" fill="#63e6e2">Authorized read</text><text x="853" y="145" class="detail">Current caller/session</text><text x="853" y="166" class="detail">Scoped durable result</text><path d="M248 139 L298 139" stroke="#819fbd" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M518 139 L568 139" stroke="#819fbd" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M788 139 L838 139" stroke="#819fbd" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="28" y="252" class="detail">Subscribe before the initial authoritative read to close the opening race.</text><text x="28" y="282" class="detail">Missed hints can be recovered by a bounded refresh or reconnect read.</text></svg>