<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 530" role="img" aria-labelledby="title desc"><title id="title">A workshop application has several roles</title><desc id="desc">A client commands a registration actor. Its events drive a roster orchestration and a separate SQL projection. The user reads the resulting SQL view through current authorization.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#819fbd" stroke-width="1.6"/></marker></defs><style>.label{font:700 17px system-ui,sans-serif}.detail{font:14px system-ui,sans-serif;fill:#b9c8db}.heading{font:700 21px system-ui,sans-serif;fill:#f3f7ff}</style><rect width="1080" height="530" rx="17" fill="#0e1624" stroke="#2b3547"/><text x="28" y="38" class="heading">A workshop application has several roles</text><rect x="28" y="80" width="205" height="98" rx="12" fill="#142033" stroke="#8ca8ff" stroke-opacity=".65"/><text x="43" y="109" class="label" fill="#8ca8ff">Client command</text><text x="43" y="135" class="detail">Current user/device</text><text x="43" y="156" class="detail">Registration business ID</text><rect x="293" y="80" width="205" height="98" rx="12" fill="#142033" stroke="#63e6e2" stroke-opacity=".65"/><text x="308" y="109" class="label" fill="#63e6e2">Registration actor</text><text x="308" y="135" class="detail">Validate lifecycle</text><text x="308" y="156" class="detail">Record domain events</text><rect x="558" y="80" width="205" height="98" rx="12" fill="#142033" stroke="#f39fc2" stroke-opacity=".65"/><text x="573" y="109" class="label" fill="#f39fc2">Registration events</text><text x="573" y="135" class="detail">History and source IDs</text><text x="573" y="156" class="detail">Requested / cancelled</text><rect x="823" y="80" width="229" height="98" rx="12" fill="#142033" stroke="#8ca8ff" stroke-opacity=".65"/><text x="838" y="109" class="label" fill="#8ca8ff">Projection</text><text x="838" y="135" class="detail">Map committed source</text><text x="838" y="156" class="detail">Apply idempotently</text><path d="M233 129 L293 129" stroke="#819fbd" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M498 129 L558 129" stroke="#819fbd" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M763 129 L823 129" stroke="#819fbd" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="558" y="252" width="205" height="98" rx="12" fill="#142033" stroke="#f39fc2" stroke-opacity=".65"/><text x="573" y="281" class="label" fill="#f39fc2">Orchestration</text><text x="573" y="307" class="detail">Address workshop actor</text><text x="573" y="328" class="detail">Send internal command</text><rect x="293" y="252" width="205" height="98" rx="12" fill="#142033" stroke="#63e6e2" stroke-opacity=".65"/><text x="308" y="281" class="label" fill="#63e6e2">Roster actor</text><text x="308" y="307" class="detail">Own roster decisions</text><text x="308" y="328" class="detail">Retain cancellation IDs</text><rect x="823" y="252" width="229" height="98" rx="12" fill="#142033" stroke="#f5c66d" stroke-opacity=".65"/><text x="838" y="281" class="label" fill="#f5c66d">SQL card + inbox</text><text x="838" y="307" class="detail">Query-shaped columns</text><text x="838" y="328" class="detail">Commit source receipt</text><path d="M660 178 L660 252" stroke="#819fbd" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M558 301 L498 301" stroke="#819fbd" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M937 178 L937 252" stroke="#819fbd" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="823" y="420" width="229" height="98" rx="12" fill="#142033" stroke="#63e6e2" stroke-opacity=".65"/><text x="838" y="449" class="label" fill="#63e6e2">Authorized reader</text><text x="838" y="475" class="detail">Filter current caller</text><text x="838" y="496" class="detail">Return small view</text><path d="M937 350 L937 420" stroke="#819fbd" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="28" y="424" class="detail">Actor replay restores local state.</text><text x="28" y="452" class="detail">The SQL view may catch up after the command.</text><text x="28" y="480" class="detail">Provider sends use durable effect work.</text></svg>