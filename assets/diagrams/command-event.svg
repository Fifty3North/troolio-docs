<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 350" role="img" aria-labelledby="title desc"><title id="title">One command, one event history</title><desc id="desc">A command reaches an actor. The handler decides an event, which is stored. Replaying stored events rebuilds actor state, which a query can read.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7794b3" stroke-width="1.8"/></marker></defs><style>.label{font:700 17px system-ui,sans-serif}.detail{font:13px system-ui,sans-serif;fill:#b4c4d9}.caption{font:14px system-ui,sans-serif;fill:#a8b5c8}.heading{font:700 20px system-ui,sans-serif;fill:#f3f7ff}</style><rect width="990" height="350" rx="17" fill="#0e1624" stroke="#2b3547"/><text x="30" y="37" class="heading">One command, one event history</text><rect x="30" y="75" width="180" height="82" rx="13" fill="#141e2e" stroke="#8ca8ff" stroke-opacity=".75"/><text x="48" y="106" class="label" fill="#8ca8ff">Command</text><text x="48" y="131" class="detail">Request to change state</text><rect x="280" y="75" width="180" height="82" rx="13" fill="#141e2e" stroke="#63e6e2" stroke-opacity=".75"/><text x="298" y="106" class="label" fill="#63e6e2">Actor Handle</text><text x="298" y="131" class="detail">Validate and decide</text><rect x="530" y="75" width="180" height="82" rx="13" fill="#141e2e" stroke="#f39fc2" stroke-opacity=".75"/><text x="548" y="106" class="label" fill="#f39fc2">Event</text><text x="548" y="131" class="detail">Fact that occurred</text><rect x="780" y="75" width="180" height="82" rx="13" fill="#141e2e" stroke="#f5c66d" stroke-opacity=".75"/><text x="798" y="106" class="label" fill="#f5c66d">Event stream</text><text x="798" y="131" class="detail">Durable history</text><path d="M210 116 L280 116" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M460 116 L530 116" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M710 116 L780 116" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M870 157 L870 236" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 6"/><rect x="30" y="236" width="180" height="82" rx="13" fill="#141e2e" stroke="#8ca8ff" stroke-opacity=".75"/><text x="48" y="267" class="label" fill="#8ca8ff">Query</text><text x="48" y="292" class="detail">Read current state</text><rect x="280" y="236" width="180" height="82" rx="13" fill="#141e2e" stroke="#63e6e2" stroke-opacity=".75"/><text x="298" y="267" class="label" fill="#63e6e2">Actor state</text><text x="298" y="292" class="detail">Rebuilt on activation</text><rect x="530" y="236" width="180" height="82" rx="13" fill="#141e2e" stroke="#f39fc2" stroke-opacity=".75"/><text x="548" y="267" class="label" fill="#f39fc2">On(event)</text><text x="548" y="292" class="detail">Apply event to state</text><rect x="780" y="236" width="180" height="82" rx="13" fill="#141e2e" stroke="#f5c66d" stroke-opacity=".75"/><text x="798" y="267" class="label" fill="#f5c66d">Replay</text><text x="798" y="292" class="detail">Read stored events</text><path d="M780 277 L710 277" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M530 277 L460 277" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M280 277 L210 277" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="30" y="190" class="caption">The event stream is the write history. State and queries are derived from it.</text></svg>