<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1085 385" role="img" aria-labelledby="title desc"><title id="title">Model a command with a rule</title><desc id="desc">A command reaches an actor validation rule. A positive amount becomes a CountAdded event; an invalid amount throws and appends nothing in this example.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7794b3" stroke-width="1.8"/></marker></defs><style>.label{font:700 17px system-ui,sans-serif}.detail{font:13px system-ui,sans-serif;fill:#b4c4d9}.caption{font:14px system-ui,sans-serif;fill:#a8b5c8}.heading{font:700 20px system-ui,sans-serif;fill:#f3f7ff}</style><rect width="1085" height="385" rx="17" fill="#0e1624" stroke="#2b3547"/><text x="30" y="37" class="heading">Model a command with a rule</text><rect x="30" y="115" width="190" height="82" rx="13" fill="#141e2e" stroke="#8ca8ff" stroke-opacity=".75"/><text x="48" y="146" class="label" fill="#8ca8ff">AddToCounter</text><text x="48" y="171" class="detail">Amount from caller</text><rect x="300" y="115" width="190" height="82" rx="13" fill="#141e2e" stroke="#63e6e2" stroke-opacity=".75"/><text x="318" y="146" class="label" fill="#63e6e2">Validate</text><text x="318" y="171" class="detail">Amount must be positive</text><rect x="610" y="65" width="190" height="82" rx="13" fill="#141e2e" stroke="#f39fc2" stroke-opacity=".75"/><text x="628" y="96" class="label" fill="#f39fc2">Accepted</text><text x="628" y="121" class="detail">Build CountAdded</text><rect x="610" y="225" width="190" height="82" rx="13" fill="#141e2e" stroke="#f5c66d" stroke-opacity=".75"/><text x="628" y="256" class="label" fill="#f5c66d">Rejected</text><text x="628" y="281" class="detail">Throw exception</text><rect x="865" y="65" width="190" height="82" rx="13" fill="#141e2e" stroke="#f39fc2" stroke-opacity=".75"/><text x="883" y="96" class="label" fill="#f39fc2">Event stream</text><text x="883" y="121" class="detail">Append CountAdded</text><rect x="865" y="225" width="190" height="82" rx="13" fill="#141e2e" stroke="#f5c66d" stroke-opacity=".75"/><text x="883" y="256" class="label" fill="#f5c66d">No append</text><text x="883" y="281" class="detail">State stays the same</text><path d="M220 156 L300 156" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M490 156 L550 156 L550 106 L610 106" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M490 156 L550 156 L550 266 L610 266" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M800 106 L865 106" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M800 266 L865 266" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="30" y="354" class="caption">This example rejects invalid amounts. A different domain may model rejection as its own event.</text></svg>