<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1035 365" role="img" aria-labelledby="title desc"><title id="title">After the event commit</title><desc id="desc">A committed event produces durable projection handoff work. Separately, a durable effect intent can be dispatched with an idempotency key.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7794b3" stroke-width="1.8"/></marker></defs><style>.label{font:700 17px system-ui,sans-serif}.detail{font:13px system-ui,sans-serif;fill:#b4c4d9}.caption{font:14px system-ui,sans-serif;fill:#a8b5c8}.heading{font:700 20px system-ui,sans-serif;fill:#f3f7ff}</style><rect width="1035" height="365" rx="17" fill="#0e1624" stroke="#2b3547"/><text x="30" y="37" class="heading">After the event commit</text><rect x="30" y="78" width="195" height="84" rx="13" fill="#141e2e" stroke="#63e6e2" stroke-opacity=".75"/><text x="48" y="109" class="label" fill="#63e6e2">Event commit</text><text x="48" y="134" class="detail">Source of truth</text><rect x="290" y="78" width="195" height="84" rx="13" fill="#141e2e" stroke="#8ca8ff" stroke-opacity=".75"/><text x="308" y="109" class="label" fill="#8ca8ff">Durable handoff</text><text x="308" y="134" class="detail">Projection work queued</text><rect x="550" y="78" width="195" height="84" rx="13" fill="#141e2e" stroke="#f39fc2" stroke-opacity=".75"/><text x="568" y="109" class="label" fill="#f39fc2">Projection worker</text><text x="568" y="134" class="detail">Apply event idempotently</text><rect x="810" y="78" width="195" height="84" rx="13" fill="#141e2e" stroke="#f5c66d" stroke-opacity=".75"/><text x="828" y="109" class="label" fill="#f5c66d">Read model</text><text x="828" y="134" class="detail">Query-oriented view</text><path d="M225 120 L290 120" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M485 120 L550 120" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M745 120 L810 120" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="300" y="212" class="caption">The command may complete before the read model catches up.</text><rect x="290" y="250" width="195" height="84" rx="13" fill="#141e2e" stroke="#8ca8ff" stroke-opacity=".75"/><text x="308" y="281" class="label" fill="#8ca8ff">Effect intent</text><text x="308" y="306" class="detail">Durable pending work</text><rect x="550" y="250" width="195" height="84" rx="13" fill="#141e2e" stroke="#f39fc2" stroke-opacity=".75"/><text x="568" y="281" class="label" fill="#f39fc2">Effect worker</text><text x="568" y="306" class="detail">Retry with stable key</text><rect x="810" y="250" width="195" height="84" rx="13" fill="#141e2e" stroke="#f5c66d" stroke-opacity=".75"/><text x="828" y="281" class="label" fill="#f5c66d">Provider</text><text x="828" y="306" class="detail">Definitive outcome</text><path d="M126 162 L126 292" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M126 292 L290 292" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M485 292 L550 292" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M745 292 L810 292" stroke="#7794b3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/></svg>